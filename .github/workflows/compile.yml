name: Build GBA ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install devkitpro GBA toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi build-essential libpng-dev

    - name: Compile ROM
      run: |
        arm-none-eabi-gcc -mthumb -mthumb-interwork -O2 -Wall -fno-strict-aliasing -mcpu=arm7tdmi main.c -o main.elf -specs=nosys.specs
        arm-none-eabi-objcopy -O binary main.elf neighbours.gba

    - name: Fix GBA Header with Python
      run: |
        python3 -c '
        import struct
        with open("neighbours.gba", "r+b") as f:
            rom = f.read()
            if len(rom) < 384:
                rom += b"\x00" * (384 - len(rom))
            
            # شعار نينتندو الرسمي المطلوب لتشغيل اللعبة على المحاكيات
            logo = bytes([
                0x24, 0xFF, 0xAE, 0x51, 0x69, 0x9A, 0xA2, 0x21, 0x3D, 0x84, 0x82, 0x0A, 0x84, 0xE4, 0x09, 0xAD,
                0x11, 0x24, 0x8B, 0x98, 0xC0, 0x81, 0x7F, 0x21, 0xA3, 0x52, 0xBE, 0x19, 0x93, 0x09, 0xCE, 0x20,
                0x10, 0x46, 0x4A, 0x4A, 0xF4, 0xFC, 0xFF, 0x01, 0xE0, 0x07, 0x3E, 0x09, 0xE3, 0xEC, 0x97, 0xEC,
                0x97, 0xEC, 0x97, 0xEC, 0x97, 0x1F, 0x3C, 0x08, 0x3F, 0x9F, 0x07, 0xA2, 0xFE, 0xFE, 0x10, 0x46,
                0x4E, 0x4A, 0x4A, 0x38, 0xC0, 0x14, 0x00, 0x18, 0x84, 0x73, 0x1D, 0x38, 0x6B, 0x86, 0x62, 0xBE,
                0x19, 0x9A, 0x0F, 0x19, 0x8E, 0x56, 0xF6, 0x90, 0xAA, 0x2E, 0x42, 0x19, 0xE0, 0x03, 0xE0, 0x61,
                0x2E, 0x3C, 0x8A, 0x66, 0x8A, 0x5D, 0x07, 0x7E, 0x3F, 0xDF, 0x07, 0xA1, 0x4E, 0x4B, 0x4B, 0x4A,
                0x4A, 0x3E, 0x3E, 0xFC, 0x4E, 0x4E, 0xEC, 0xFC, 0x00, 0x24, 0x00, 0x21, 0xAA, 0x56, 0xF6, 0x18,
                0x9A, 0x3E, 0x1C, 0xD0, 0xA2, 0x22, 0x3C, 0xE4, 0x86, 0xE4, 0x0E, 0x19, 0x3C, 0x10, 0x7F, 0x2A,
                0x5F, 0x07, 0xA2, 0x21, 0x93, 0x09, 0xCE, 0x20, 0x10, 0x46, 0x2E, 0x38, 0xFC, 0x14, 0x00, 0x18
            ])
            
            f.seek(4)
            f.write(logo)
            
            # اسم اللعبة وكود التعريف
            f.seek(0xA0)
            f.write(b"NEIGHBOURS\x00\x00") # الاسم 12 خانة
            f.write(b"JGBX") # كود اللعبة 4 خانات
            f.write(b"01") # كود المصنع
            
            f.seek(0xB2)
            f.write(b"\x96") # قيمة ثابتة مطلوبة
            
            # حساب قيمة الـ Checksum البرمجية وتثبيتها في الهيدر
            f.seek(0xA0)
            header_data = f.read(29)
            chk = 0
            for b in header_data:
                chk = (chk - b) & 0xFF
            chk = (chk - 0x19) & 0xFF
            
            f.seek(0xBD)
            f.write(bytes([chk]))
            print("Done! GBA Header was successfully injected and verified locally.")
        '

    - name: Upload GBA ROM
      uses: actions/upload-artifact@v4
      with:
        name: NeighboursFromHell-GBA
        path: neighbours.gba        
